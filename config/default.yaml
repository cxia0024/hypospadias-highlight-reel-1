pipeline:
  phases: [detection, phase_recognition, frame_caption, clip_caption, synthesis]
  device: "cuda"  # or "cpu"

video:
  sample_fps: 0.1          # 1 frame every 10 seconds
  clip_duration_sec: 10    # sliding window for clip grouping
  clip_stride_sec: 5       # stride between clip windows

phase1_detection:
  model: "vit"
  weights: "models/hypospadias_vit_detector.pt"
  confidence_threshold: 0.5
  image_size: 224
  patch_size: 16
  embed_dim: 768
  num_heads: 12
  num_layers: 12
  mlp_dim: 3072
  dropout: 0.1
  classes:
    - scissors
    - forceps
    - needle_driver
    - suture
    - catheter
    - urethral_plate
    - glans
    - skin_flap
    - dartos_flap

phase_recognition:
  model: "temporal_cnn"
  weights: "models/hypospadias_phase_recognition.pt"
  temporal_smoothing_window: 15
  transition_penalty: 0.3
  phases:
    - preparation
    - degloving
    - urethral_plate_incision
    - tubularization
    - waterproofing
    - glansplasty
    - skin_closure
    - dressing

phase2_frame_caption:
  model_name: "claude-haiku-4-5-20251001"
  prompt_template: "Describe the surgical scene showing {detected_objects}."
  max_tokens: 80

phase3_clip_caption:
  model_name: "claude-haiku-4-5-20251001"
  max_tokens: 150
  context_window_frames: 10
  prompt_template: |
    Given these consecutive frame descriptions from a hypospadias repair video,
    write a single coherent sentence describing the surgical action in this clip.

phase4_synthesis:
  highlight_reel:
    max_duration_sec: 120
    selection_strategy: "importance_score"  # importance_score | uniform | phase_balanced
    min_clip_score: 0.6
  report:
    format: "markdown"
    sections:
      - summary
      - phase_timeline
      - key_moments
      - instrument_usage
